<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101512" />
    <title>Offline · GainAI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101512; color: #f5f7f5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: #101512; }
      main { width: min(100% - 2rem, 52rem); margin: 0 auto; padding: 2rem 0 4rem; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 1px solid #29312c; }
      .brand { display: flex; align-items: center; gap: .75rem; font-weight: 700; }
      .brand img { width: 2rem; height: 2rem; }
      .status { border: 1px solid #57635b; border-radius: 999px; padding: .4rem .75rem; color: #d1d8d2; font-size: .8rem; }
      h1 { margin: 2rem 0 .5rem; font-size: clamp(1.75rem, 5vw, 2.5rem); }
      p { color: #a8b0ab; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.5rem 0; }
      nav a { border: 1px solid #38433b; border-radius: .65rem; padding: .65rem .85rem; color: #dce5dd; text-decoration: none; }
      nav a:hover, nav a:focus-visible { border-color: #00e67a; color: #00e67a; }
      #cache-content { display: grid; gap: .85rem; margin-top: 1.5rem; }
      article { min-width: 0; border: 1px solid #29312c; border-radius: .85rem; padding: 1rem; background: #171e19; }
      article h2 { margin: 0 0 .75rem; font-size: 1rem; }
      pre { max-height: 24rem; overflow: auto; margin: 0; color: #c2ccc4; font: .8rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      .empty { color: #c2ccc4; }
      @media (min-width: 40rem) { #cache-content { grid-template-columns: repeat(2, minmax(0, 1fr)); } article.wide { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><img src="/logo.png" alt="" /><span>GainAI</span></div>
        <span class="status" role="status">Offline · read only</span>
      </header>
      <h1 id="page-title">Your saved fitness data</h1>
      <p id="page-description">You&apos;re offline. Cached data is available to view; actions that need a connection are paused.</p>
      <nav aria-label="Cached sections">
        <a href="/offline.html?offlineView=dashboard">Dashboard</a>
        <a href="/offline.html?offlineView=profile">Profile</a>
        <a href="/offline.html?offlineView=progress">Progress &amp; history</a>
        <a href="/offline.html?offlineView=plans">Workout plan</a>
        <a href="/offline.html?offlineView=pricing">Pricing</a>
      </nav>
      <section id="cache-content" aria-live="polite" aria-busy="true"></section>
    </main>
    <script>
      const databaseName = 'gainai-offline'
      const storeName = 'user-content'
      const content = document.getElementById('cache-content')
      const pathname = window.location.pathname
      const requestedView = new URLSearchParams(window.location.search).get('offlineView')
      const view = requestedView || (pathname === '/profile' ? 'profile' : pathname === '/progress' ? 'progress' : pathname === '/plans' ? 'plans' : pathname === '/pricing' ? 'pricing' : 'dashboard')

      const titles = { dashboard: 'Dashboard', profile: 'Profile', progress: 'Progress & history', plans: 'Workout plan', pricing: 'Pricing' }
      document.getElementById('page-title').textContent = titles[view] || titles.dashboard

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(databaseName, 1)
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains(storeName)) request.result.createObjectStore(storeName, { keyPath: 'key' })
          }
          request.onsuccess = () => resolve(request.result)
          request.onerror = () => reject(request.error)
        })
      }

      async function readValue(database, key) {
        return new Promise((resolve, reject) => {
          const request = database.transaction(storeName, 'readonly').objectStore(storeName).get(key)
          request.onsuccess = () => resolve(request.result ? request.result.value : null)
          request.onerror = () => reject(request.error)
        })
      }

      function addCard(title, value, wide = false) {
        if (value === null || value === undefined) return
        const article = document.createElement('article')
        if (wide) article.className = 'wide'
        const heading = document.createElement('h2')
        heading.textContent = title
        const pre = document.createElement('pre')
        const text = typeof value === 'string' ? value : JSON.stringify(value, null, 2)
        pre.textContent = text.length > 12000 ? `${text.slice(0, 12000)}\n…` : text
        article.append(heading, pre)
        content.append(article)
      }

      async function loadCachedView() {
        try {
          const database = await openDatabase()
          try {
            const identity = await readValue(database, 'offline:identity')
            if (!identity?.id) {
              const message = document.createElement('p')
              message.className = 'empty'
              message.textContent = 'No signed-in account or saved data is available on this device. Connect to the internet and open the app to prepare offline access.'
              content.append(message)
              return
            }

            const userId = identity.id
            const [dashboard, workoutPlan] = await Promise.all([
              readValue(database, `${userId}:dashboard`),
              readValue(database, `${userId}:workout-plan`),
            ])

            if (view === 'pricing') {
              addCard('Pricing', 'Pricing and subscription details are not available offline.')
            } else if (view === 'plans') {
              addCard('Saved workout plan', workoutPlan?.plan || 'No workout plan has been saved on this device.', true)
            } else if (view === 'profile') {
              addCard('Profile', dashboard?.profile || 'No profile has been saved on this device.')
              addCard('Workout profile', dashboard?.workoutProfile)
            } else if (view === 'progress') {
              const progressRecords = await new Promise((resolve, reject) => {
                const request = database.transaction(storeName, 'readonly').objectStore(storeName).getAll()
                request.onsuccess = () => resolve(request.result.filter((entry) => entry.key.startsWith(`${userId}:progress-`)).map((entry) => ({ period: entry.key.slice(`${userId}:progress-`.length), ...entry.value })))
                request.onerror = () => reject(request.error)
              })
              addCard('Saved progress periods', progressRecords.length ? progressRecords : 'No progress history has been saved on this device yet.', true)
              addCard('Daily nutrition history', dashboard?.dailyLogs)
              addCard('Latest body scan', dashboard?.bodyScan)
            } else {
              if (!dashboard) {
                const message = document.createElement('p')
                message.className = 'empty'
                message.textContent = 'No dashboard data has been saved yet. Connect to the internet and open the dashboard to prepare it for offline use.'
                content.append(message)
                return
              }
              addCard("Today's nutrition", dashboard.todayStats)
              addCard('Profile and goals', dashboard.profile)
              addCard("Today's food log", dashboard.todayScans)
              addCard('Weekly activity', { daysWithScans: dashboard.weekCount, range: dashboard.weekLabel })
              addCard('Next workout', workoutPlan?.plan || (dashboard.hasWorkoutPlan ? 'A workout plan is saved. Open Workout plan to view it.' : 'No workout plan is saved.'), true)
              addCard('Recent body scan', dashboard.bodyScan)
            }
          } finally {
            database.close()
          }
        } catch {
          const message = document.createElement('p')
          message.className = 'empty'
          message.textContent = 'Saved data could not be opened. Reconnect to the internet to continue using GainAI.'
          content.append(message)
        } finally {
          content.setAttribute('aria-busy', 'false')
        }
      }

      loadCachedView()
    </script>
  </body>
</html>
